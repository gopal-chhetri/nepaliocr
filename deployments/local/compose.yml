services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nepaliocr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: deployments/local/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/nepaliocr"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend:/app

  frontend:
    build:
      context: ../..
      dockerfile: deployments/local/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: