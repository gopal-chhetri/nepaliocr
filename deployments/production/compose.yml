name: nepaliocr

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.nepaliocr_minio_http.entrypoints=http"
      - "traefik.http.routers.nepaliocr_minio_http.rule=Host(`minio.${DOMAIN:-ocr.soylab.dpdns.org}`)"
      - "traefik.http.routers.nepaliocr_minio_https.entrypoints=https"
      - "traefik.http.routers.nepaliocr_minio_https.rule=Host(`minio.${DOMAIN:-ocr.soylab.dpdns.org}`)"
      - "traefik.http.routers.nepaliocr_minio_https.tls=true"
      - "traefik.http.routers.nepaliocr_minio_https.tls.certresolver=le"
      - "traefik.http.routers.nepaliocr_minio_https.service=nepaliocr_minio"
      - "traefik.http.services.nepaliocr_minio.loadbalancer.server.port=9000"
      - "traefik.http.routers.nepaliocr_minio_http.middlewares=https-redirect"
      - "traefik.http.routers.nepaliocr_minio_console_http.entrypoints=http"
      - "traefik.http.routers.nepaliocr_minio_console_http.rule=Host(`minio-console.${DOMAIN:-ocr.soylab.dpdns.org}`)"
      - "traefik.http.routers.nepaliocr_minio_console_http.middlewares=https-redirect"
      - "traefik.http.routers.nepaliocr_minio_console_https.entrypoints=https"
      - "traefik.http.routers.nepaliocr_minio_console_https.rule=Host(`minio-console.${DOMAIN:-ocr.soylab.dpdns.org}`)"
      - "traefik.http.routers.nepaliocr_minio_console_https.tls=true"
      - "traefik.http.routers.nepaliocr_minio_console_https.tls.certresolver=le"
      - "traefik.http.routers.nepaliocr_minio_console_https.service=nepaliocr_minio_console"
      - "traefik.http.services.nepaliocr_minio_console.loadbalancer.server.port=9001"
    networks:
      - default
      - traefik-network

  backend:
    image: ghcr.io/${REGISTRY_OWNER:-gopal-chhetri}/nepaliocr-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEYS: ${OPENROUTER_API_KEYS}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-nepali-ocr}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: minio.${DOMAIN:-ocr.soylab.dpdns.org}
      MINIO_PUBLIC_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.nepaliocr_api_http.entrypoints=http"
      - "traefik.http.routers.nepaliocr_api_http.rule=Host(`${DOMAIN:-ocr.soylab.dpdns.org}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.nepaliocr_api_https.entrypoints=https"
      - "traefik.http.routers.nepaliocr_api_https.rule=Host(`${DOMAIN:-ocr.soylab.dpdns.org}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.nepaliocr_api_https.tls=true"
      - "traefik.http.routers.nepaliocr_api_https.tls.certresolver=le"
      - "traefik.http.routers.nepaliocr_api_https.service=nepaliocr_api"
      - "traefik.http.services.nepaliocr_api.loadbalancer.server.port=8000"
      - "traefik.http.routers.nepaliocr_api_http.middlewares=https-redirect"
    networks:
      - default
      - traefik-network

  worker:
    image: ghcr.io/${REGISTRY_OWNER:-gopal-chhetri}/nepaliocr-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "arq", "app.jobs.WorkerSettings"]
    environment:
      OPENROUTER_API_KEYS: ${OPENROUTER_API_KEYS}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-nepali-ocr}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: minio.${DOMAIN:-ocr.soylab.dpdns.org}
      MINIO_PUBLIC_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - default

  frontend:
    image: ghcr.io/${REGISTRY_OWNER:-gopal-chhetri}/nepaliocr-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.routers.nepaliocr_http.entrypoints=http"
      - "traefik.http.routers.nepaliocr_http.rule=Host(`${DOMAIN:-ocr.soylab.dpdns.org}`)"
      - "traefik.http.routers.nepaliocr_https.entrypoints=https"
      - "traefik.http.routers.nepaliocr_https.rule=Host(`${DOMAIN:-ocr.soylab.dpdns.org}`)"
      - "traefik.http.routers.nepaliocr_https.tls=true"
      - "traefik.http.routers.nepaliocr_https.tls.certresolver=le"
      - "traefik.http.routers.nepaliocr_https.service=nepaliocr_frontend"
      - "traefik.http.services.nepaliocr_frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.nepaliocr_http.middlewares=https-redirect"
    networks:
      - default
      - traefik-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  traefik-network:
    external: true
